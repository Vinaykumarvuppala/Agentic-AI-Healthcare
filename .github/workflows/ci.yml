name: Python CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Import smoke test
        run: python -c "import cms_transactions, cms_source_diagnostics, cms_quarterly, etl_exports; print('Optional module imports OK')"
      - name: Run unit tests
        run: pytest -q
      - name: Check syntax
        run: python -m compileall -q app.py cms_agent.py llm_rag.py policy_rag.py research_agent.py comparison.py comparison_explain.py investigation.py lifecycle.py investigation_graph.py cms_quarterly.py etl_exports.py cms_transactions.py cms_source_diagnostics.py custom_etl.py autocomplete.py
