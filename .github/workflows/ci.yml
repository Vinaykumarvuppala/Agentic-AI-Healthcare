name: Python CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pandas numpy requests pytest langgraph pypdf
      - name: Run unit tests
        run: pytest -q
      - name: Check syntax
        run: python -m compileall -q app.py cms_agent.py llm_rag.py policy_rag.py research_agent.py comparison.py comparison_explain.py autocomplete.py
